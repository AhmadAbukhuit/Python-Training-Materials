name: Lint Python (Ruff)

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'ruff.toml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'ruff.toml'
  workflow_dispatch:

jobs:
  ruff:
    name: Run Ruff Linter
    runs-on: ubuntu-latest

    # CRITICAL: This permission allows the bot to read/write issues
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff and capture output
        id: linter
        run: ruff check --output-format concise . 2>&1 | tee ruff_report.txt
        continue-on-error: true # Keep going so we can manage issues

      - name: Manage GitHub Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # We run this step ALWAYS, even if the linter passes, so it can close fixed issues
        run: |
          # Ensure the 'python' label exists
          gh label create "python" --description "Python code quality and linting issues" --color "3572A5" --force || true

          # 1. Create a list of files that failed (if any)
          touch bad_files.txt
          if [ -s ruff_report.txt ]; then
            grep -oE '^[^:]+\.py' ruff_report.txt | sort -u > bad_files.txt || true
          fi

          # 2. Get all currently OPEN linting issues created by this workflow
          gh issue list --label "python" --search "in:title 🐍 Python Lint Errors (Ruff):" --state open --json number,title -q '.[] | "\(.number) \(.title)"' | sed 's/ 🐍 Python Lint Errors (Ruff): /\t/' > open_issues.txt || touch open_issues.txt

          # 3. CLOSE issues for files that are now fixed
          while IFS=$'\t' read -r issue_num file_path; do
            if [ -n "$issue_num" ] && ! grep -Fxq "$file_path" bad_files.txt; then
              echo "Closing issue #$issue_num for $file_path (Fixed!)"
              gh issue close "$issue_num" --comment "✅ The Python linting issues in \`$file_path\` have been fixed in the latest commit!" --reason "completed"
            fi
          done < open_issues.txt

          # 4. CREATE issues only for NEW failures (prevents duplicates)
          while IFS= read -r file; do
            [ -z "$file" ] && continue # Skip empty lines

            # Check if an issue already exists for this file
            if ! grep -Fq "$file" open_issues.txt; then
              grep "^$file:" ruff_report.txt > current_file_errors.txt || grep "^$file" ruff_report.txt > current_file_errors.txt

              gh issue create \
                --title "🐍 Python Lint Errors (Ruff): $file" \
                --body "The automated Ruff linter found code issues in \`$file\`. Please review and fix them.

                **Error Details:**
                \`\`\`text
                $(cat current_file_errors.txt)
                \`\`\`" \
                --label "python"
            fi
          done < bad_files.txt

      - name: Fail the workflow
        # Finally, force the workflow to show a red "X" if the linter failed
        if: steps.linter.outcome == 'failure'
        run: exit 1
